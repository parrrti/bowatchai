name: build
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode (26 for Liquid Glass)
        run: |
          ls /Applications | grep -i xcode || true
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$X" ] && X=/Applications/Xcode.app
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build iOS
        run: |
          set -o pipefail
          xcodebuild -project bowatch.xcodeproj -scheme bowatch-iOS \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-ios.log
      - name: Build watchOS
        run: |
          xcodebuild -project bowatch.xcodeproj -scheme bowatch-watchOS \
            -destination "generic/platform=watchOS Simulator" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-watch.log
      - name: Save errors for remote debugging
        if: failure()
        run: |
          : > errors.md
          for f in build-ios.log build-watch.log; do
            [ -f "$f" ] || continue
            echo "## $f" >> errors.md
            grep -E "error:" "$f" | sort -u | head -40 >> errors.md || true
            echo "--- tail ---" >> errors.md
            tail -20 "$f" >> errors.md || true
          done
          git config user.name ci-bot
          git config user.email bot@users.noreply.github.com
          git add errors.md
          git commit -qm "ci: log errors" || true
          git push || true
      - name: Build iOS device (unsigned, for re-signing tools)
        run: |
          set -o pipefail
          xcodebuild -project bowatch.xcodeproj -scheme bowatch-iOS \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            -archivePath build/ios.xcarchive archive 2>&1 | tee build-device.log
      - name: Package ipa
        run: |
          mkdir -p Payload
          cp -R build/ios.xcarchive/Products/Applications/*.app Payload/
          zip -qry bowatch.ipa Payload
      - name: Read version
        id: ver
        run: echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: bowatch.ipa
          body: unsigned device build — re-sign with ESign / 爱思助手
