name: build
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build iOS
        run: |
          set -o pipefail
          xcodebuild -project bowatch.xcodeproj -scheme bowatch-iOS \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-ios.log
      - name: Build watchOS
        run: |
          xcodebuild -project bowatch.xcodeproj -scheme bowatch-watchOS \
            -destination "generic/platform=watchOS Simulator" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-watch.log
      - name: Save errors for remote debugging
        if: failure()
        run: |
          : > errors.md
          for f in build-ios.log build-watch.log; do
            [ -f "$f" ] || continue
            echo "## $f" >> errors.md
            grep -E "error:" "$f" | sort -u | head -40 >> errors.md || true
            echo "--- tail ---" >> errors.md
            tail -20 "$f" >> errors.md || true
          done
          git config user.name ci-bot
          git config user.email bot@users.noreply.github.com
          git add errors.md
          git commit -qm "ci: log errors" || true
          git push || true
