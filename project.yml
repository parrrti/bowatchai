name: bowatch
options:
  bundleIdPrefix: top.jing
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
targets:
  bowatch:
    type: application
    platform: iOS
    sources:
      - Sources/iOS
      - Sources/Shared
      - Assets.xcassets
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_FILE: Sources/iOS/Info.plist
  bowatchWatch:
    type: application
    platform: watchOS
    sources:
      - Sources/WatchApp
      - Sources/Shared
      - Assets.xcassets
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/WatchApp/Info.plist
schemes:
  bowatch-iOS:
    build:
      targets:
        bowatch: all
  bowatch-watchOS:
    build:
      targets:
        bowatchWatch: all
