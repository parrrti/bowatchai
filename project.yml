name: bowatch
options:
  bundleIdPrefix: top.jing
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
targets:
  bowatch:
    type: application
    platform: iOS
    sources:
      - Sources/iOS
      - Sources/Shared
      - Sources/SharedActivity
      - Assets.xcassets
    dependencies:
      - target: bowatchWidget
        embed: true
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_FILE: Sources/iOS/Info.plist
  bowatchWidget:
    type: bundle.widget-extension
    platform: iOS
    sources:
      - Sources/Widget
      - Sources/SharedActivity
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/Widget/Info.plist
        SKIP_INSTALL: YES
  bowatchWatch:
    type: application
    platform: watchOS
    sources:
      - Sources/WatchApp
      - Sources/Shared
      - Assets.xcassets
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/WatchApp/Info.plist
schemes:
  bowatch-iOS:
    build:
      targets:
        bowatch: all
  bowatch-watchOS:
    build:
      targets:
        bowatchWatch: all
