name: bowatch
options:
  bundleIdPrefix: top.jing
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
targets:
  bowatch:
    type: application
    platform: iOS
    sources:
      - Sources/iOS
      - Sources/Shared
      - Sources/SharedActivity
      - Assets.xcassets
    dependencies:
      - target: bowatchWidget
        embed: true
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.0.32"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_FILE: Sources/iOS/Info.plist
  bowatchWidget:
    type: app-extension
    platform: iOS
    sources:
      - Sources/Widget
      - Sources/SharedActivity
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleDisplayName: bowatch Live
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
  bowatchWatch:
    type: application
    platform: watchOS
    sources:
      - Sources/WatchApp
      - Sources/Shared
      - Assets.xcassets
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/WatchApp/Info.plist
schemes:
  bowatch-iOS:
    build:
      targets:
        bowatch: all
  bowatch-watchOS:
    build:
      targets:
        bowatchWatch: all
